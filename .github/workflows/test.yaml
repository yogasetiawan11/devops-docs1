# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: cicd

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/test.yaml
      - services/**
  workflow_dispatch:

jobs:
  # this job will tell use to execute specific changes within matrix jobs
  filter:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
    steps:
      - name: checkout
        uses: actions/checkout@v5.0.0
      - name: filter changes
        id: filter
        uses: dorny/paths-filter@v4
        with: 
          token: ${secret.GITHUB_TOKEN}
          filter: ./github/utils/file-filters.yaml # specify path contains the filters located


  test:   
    runs-on: ubuntu-latest
    needs: filter
    strategy:
      fail-fast: false
      matrix:
        service: 
          [
            "services/node/api-node",
            "services/react/client-react",
            "services/go/api-golang",
            "services/python/load-generator-python",
          ]
      
    steps:
      - name: checkout
        uses: actions/checkout@v5.0.0
      - name: setup node
        if: ${{ startsWith(matrix.service, 'services/node/' ) || startsWith(matrix.service, 'services/react/' ) }}
        uses: actions/setup-node@v4.4.0
        with: 
          node-version-file: ${{ matrix.service }}/package.json
          cache: "npm"
          cache-dependency-path: ${{ matrix.service }}/package-lock.json
    # setup GO **
      - name: setup golang env
        if: ${{ startsWith(matrix.service, 'services/go/' ) }}
        uses: actions/setup-go@v5.5.0          
        with: 
          go-version-file: ${{ matrix.service }}/go.mod
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Install Poetry
        if: ${{ startsWith(matrix.service, 'services/python/' ) }}
        uses: snok/install-poetry@v1

      - name: setup python project
        if: ${{ startsWith(matrix.service, 'services/python/' ) }}
        uses: actions/setup-python@v7          
        with: 
          go-version-file: ${{ matrix.service }}/pyproject.toml
          cache-dependency-path: ${{ matrix.service }}/poetry.lock

      - name: Install task
        run: |
          set -e
          ARCH=$(dpkg --print-architecture)
          VERSION=3.44.1
          curl -sSL "https://github.com/go-task/task/releases/download/v${VERSION}/task_linux_${ARCH}.tar.gz" \
            | tar -xz -C /usr/local/bin task
          chmod +x /usr/local/bin/task
          task --version


      - name: Install ${{ matrix.service }} dependencies
        working-directory: ${{ matrix.service }}
        run: | 
          task install-ci

      - name: run  ${{ matrix.service }} applications 
        working-directory: ${{ matrix.service }}
        run: | 
          task test

          


          