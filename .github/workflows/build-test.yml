# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: 
          node-version-file: services/node/api-node/package.json
          cache: 'npm'
          cache-dependency-path: services/node/api-node/package.json

      - name: Install task
        uses: supplypike/setup-bin@v5
        with:
          uri: 'https://github.com/go-task/task/releases/download/v3.54.0/task_darwin_amd64.tar.gz'
          name: task

      - name: Install node deps 
        working-directory: services/node/api-node
        run: | 
          task npm-ci


      - name: Run test app 
        working-directory: services/node/api-node
        run: | 
          task test